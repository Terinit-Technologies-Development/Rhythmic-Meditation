# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX package structure. This project uses AndroidX only.
android.useAndroidX=true
android.nonTransitiveRClass=true

# Compose 1.12 / Lifecycle 2.11 require compileSdk 37; AGP 9.1 "recommends" 36.
android.suppressUnsupportedCompileSdk=37

# AGP 9 built-in Kotlin support is enabled (default). The kotlin-android
# plugin is intentionally NOT applied; see README "Build toolchain".
#
# KSP (Room) still registers its generated sources through the kotlin.sourceSets
# DSL. AGP 9 documents this flag as the supported way to accept that until KSP
# migrates; revisit when upgrading AGP/KSP (AGP 10 may remove the escape hatch).
android.disallowKotlinSourceSets=false
